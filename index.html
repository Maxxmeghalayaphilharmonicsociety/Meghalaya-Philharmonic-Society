<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meghalaya Philharmonic Society — J.S. Bach MIDI Archive</title>
  <style>
    :root {
      --bg-deep: #120e0a;
      --bg-panel: #1c1510;
      --bg-card: #241b14;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.25);
      --ivory: #f5efe6;
      --muted: #c7b9a5;
      --border: rgba(212, 175, 55, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      background: radial-gradient(circle at top, #281d14 0%, var(--bg-deep) 70%);
      color: var(--ivory);
      min-height: 100vh;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
    }

    header.palace-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      background: linear-gradient(135deg, rgba(42, 30, 20, 0.95), rgba(20, 15, 11, 0.95));
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--gold);
    }

    .brand-title {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: 0.04em;
      color: var(--gold);
    }

    .motto {
      margin: 4px 0 0;
      font-style: italic;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .midi-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    select, input[type="search"], button {
      font-family: inherit;
      color: var(--ivory);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      background: linear-gradient(180deg, #3a2b18, #24190d);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
    }

    button:hover {
      background: linear-gradient(180deg, #4b3820, #2f2112);
    }

    .player-deck {
      margin-top: 18px;
      padding: 18px 22px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .now-playing-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .now-playing-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .transport-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .tempo-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width 80ms linear;
    }

    .keyboard-wrap {
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .piano-88 {
      position: relative;
      display: flex;
      height: 112px;
      min-width: 780px;
      background: #0d0a08;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      user-select: none;
    }

    .white-key {
      position: relative;
      flex: 1;
      height: 100%;
      background: linear-gradient(180deg, #fffdf9 0%, #ede3d2 100%);
      border: 1px solid #2b2118;
      border-radius: 0 0 4px 4px;
      z-index: 1;
    }

    .white-key.active {
      background: linear-gradient(180deg, #ffe999 0%, var(--gold) 100%);
    }

    .black-key {
      position: absolute;
      top: 4px;
      width: 1.35%;
      height: 62%;
      background: linear-gradient(180deg, #332920 0%, #120e0b 100%);
      border: 1px solid #000;
      border-radius: 0 0 3px 3px;
      z-index: 2;
      transform: translateX(-50%);
    }

    .black-key.active {
      background: linear-gradient(180deg, #f3cb4b 0%, #a87e12 100%);
    }

    .catalog-section {
      margin-top: 22px;
    }

    .catalog-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }

    #search-input {
      flex: 1 1 240px;
    }

    .track-list {
      display: grid;
      gap: 8px;
    }

    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 7px;
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.18);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .track-row:hover {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--gold);
    }

    .track-row.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold);
    }

    .bwv-badge {
      display: inline-block;
      padding: 2px 8px;
      margin-right: 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: var(--gold);
      color: #16120e;
    }

    .track-meta {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="palace-header">
      <div class="brand">
        <img src="image_d54689.png" alt="Meghalaya Philharmonic Society Emblem" />
        <div>
          <h1 class="brand-title">Meghalaya Philharmonic Society</h1>
          <p class="motto">Musica Est Vita / Music is Life — J.S. Bach MIDI Archive</p>
        </div>
      </div>

      <div class="midi-status">
        <label for="midi-out-select">MIDI Out:</label>
        <select id="midi-out-select">
          <option value="">Web MIDI: Detecting...</option>
        </select>
        <button id="panic-btn" type="button" title="Reset Controllers (CC#121) & All Notes Off (CC#123)">
          Panic / Reset
        </button>
      </div>
    </header>

    <section class="player-deck">
      <div class="now-playing-row">
        <div class="now-playing-title" id="now-playing">Select a piece from the catalog to begin</div>
        <div class="track-meta" id="time-readout">00:00 / 00:00</div>
      </div>

      <div class="transport-bar">
        <button id="play-pause-btn" type="button">Play / Pause</button>
        <button id="stop-btn" type="button">Stop</button>

        <div class="tempo-control">
          <label for="tempo-slider">Tempo Scale:</label>
          <input id="tempo-slider" type="range" min="0.5" max="1.5" step="0.05" value="1.0" />
          <span id="tempo-value">100%</span>
        </div>
      </div>

      <div class="progress-track" id="progress-track" title="Seek">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="keyboard-wrap">
        <div class="piano-88" id="piano-88"></div>
      </div>
    </section>

    <section class="catalog-section">
      <div class="catalog-controls">
        <input
          id="search-input"
          type="search"
          placeholder="Search BWV number, piece title, or track..."
        />

        <select id="category-filter">
          <option value="ALL">All Sources</option>
          <option value="bach">Bach Folder (midi/bach)</option>
          <option value="Glenn Gould">Glenn Gould</option>
          <option value="2002  eCompetition Winners (MID)">2002 eCompetition</option>
          <option value="2004  eCompetition Winners (MID)">2004 eCompetition</option>
          <option value="2006 eCompetition Winners (MID)">2006 eCompetition</option>
          <option value="2008 eCompetiion Winners (MID)">2008 eCompetition</option>
          <option value="2009 eCompetition (MID) Winners">2009 eCompetition</option>
          <option value="2011 Disklavier Competition Winners (MID)">2011 Disklavier</option>
          <option value="2011 eCompetition (MID)">2011 eCompetition</option>
        </select>

        <select id="sort-select">
          <option value="bwv">Sort: BWV Number</option>
          <option value="order">Sort: Catalog Order</option>
          <option value="title">Sort: Title (A–Z)</option>
        </select>
      </div>

      <div class="track-list" id="track-list"></div>
    </section>
  </div>

  <script>
    // =========================================================================
    // 1. 88-Key Virtual Piano (MIDI Notes 21 [A0] to 108 [C8])
    // =========================================================================
    const keyElements = new Map();

    function build88KeyPiano() {
      const pianoEl = document.getElementById("piano-88");
      pianoEl.innerHTML = "";
      keyElements.clear();

      const isBlackNote = (midi) => [1, 3, 6, 8, 10].includes(midi % 12);
      const whiteNotes = [];
      for (let m = 21; m <= 108; m++) {
        if (!isBlackNote(m)) whiteNotes.push(m);
      }

      whiteNotes.forEach((midi) => {
        const wKey = document.createElement("div");
        wKey.className = "white-key";
        wKey.dataset.midi = midi;
        pianoEl.appendChild(wKey);
        keyElements.set(midi, wKey);
      });

      const totalWhite = whiteNotes.length; // 52 white keys
      for (let m = 21; m <= 108; m++) {
        if (!isBlackNote(m)) continue;
        let whiteBefore = 0;
        for (let k = 21; k < m; k++) {
          if (!isBlackNote(k)) whiteBefore++;
        }
        const leftPercent = (whiteBefore / totalWhite) * 100;
        const bKey = document.createElement("div");
        bKey.className = "black-key";
        bKey.dataset.midi = m;
        bKey.style.left = `${leftPercent}%`;
        pianoEl.appendChild(bKey);
        keyElements.set(m, bKey);
      }
    }

    function setKeyActive(midi, active) {
      const el = keyElements.get(midi);
      if (!el) return;
      el.classList.toggle("active", Boolean(active));
    }

    function clearAllKeys() {
      keyElements.forEach((el) => el.classList.remove("active"));
    }

    // =========================================================================
    // 2. Web MIDI Output & High-Definition MIDI Engine (HiDefMidiPlayer)
    // =========================================================================
    class HiDefMidiPlayer {
      constructor() {
        this.midiAccess = null;
        this.midiOutput = null;
        this.events = [];
        this.durationSec = 0;
        this.isPlaying = false;
        this.tempoScale = 1.0;
        this.songTimeSec = 0;
        this.lastPerfMs = null;
        this.nextEventIdx = 0;
        this.lookaheadSec = 0.08;
        this.rafId = null;
        this.onProgress = null;
      }

      async initWebMidi() {
        const selectEl = document.getElementById("midi-out-select");
        if (!navigator.requestMIDIAccess) {
          selectEl.innerHTML = `<option value="">Web MIDI Unsupported</option>`;
          return;
        }
        try {
          this.midiAccess = await navigator.requestMIDIAccess({ sysex: true });
          const refreshOutputs = () => {
            const outputs = Array.from(this.midiAccess.outputs.values());
            selectEl.innerHTML = `<option value="">-- Internal Visual Only --</option>`;
            outputs.forEach((port) => {
              const opt = document.createElement("option");
              opt.value = port.id;
              opt.textContent = port.name || `MIDI Out (${port.id})`;
              selectEl.appendChild(opt);
            });
            if (outputs.length > 0 && !this.midiOutput) {
              this.midiOutput = outputs[0];
              selectEl.value = outputs[0].id;
            }
          };
          refreshOutputs();
          this.midiAccess.onstatechange = refreshOutputs;
          selectEl.addEventListener("change", () => {
            this.midiOutput = this.midiAccess.outputs.get(selectEl.value) || null;
            this.sendPanicReset();
          });
        } catch {
          selectEl.innerHTML = `<option value="">Web MIDI Blocked/Unavailable</option>`;
        }
      }

      sendRaw(bytes, timestampMs = performance.now()) {
        if (!this.midiOutput || !bytes || !bytes.length) return;
        try {
          this.midiOutput.send(bytes, timestampMs);
        } catch {
          // Ignore transient output errors
        }
      }

      sendPanicReset() {
        for (let ch = 0; ch < 16; ch++) {
          this.sendRaw([0xB0 | ch, 121, 0]); // CC#121 Reset All Controllers
          this.sendRaw([0xB0 | ch, 123, 0]); // CC#123 All Notes Off
          this.sendRaw([0xB0 | ch, 64, 0]);  // Sustain off
          this.sendRaw([0xB0 | ch, 66, 0]);  // Sostenuto off
          this.sendRaw([0xB0 | ch, 67, 0]);  // Soft pedal off
        }
        clearAllKeys();
      }

      // Standard MIDI File (.mid) parser with tempo, multi-channel, CC#64/66/67/88, and SysEx
      parseStandardMidi(arrayBuffer) {
        const view = new DataView(arrayBuffer);
        let pos = 0;

        const readStr = (len) => {
          let s = "";
          for (let i = 0; i < len; i++) s += String.fromCharCode(view.getUint8(pos++));
          return s;
        };
        const readU32 = () => {
          const v = view.getUint32(pos);
          pos += 4;
          return v;
        };
        const readU16 = () => {
          const v = view.getUint16(pos);
          pos += 2;
          return v;
        };
        const readVarLen = () => {
          let value = 0;
          let b;
          do {
            b = view.getUint8(pos++);
            value = (value << 7) | (b & 0x7F);
          } while (b & 0x80);
          return value;
        };

        if (readStr(4) !== "MThd") throw new Error("Invalid MIDI header");
        const headerLen = readU32();
        const format = readU16();
        const numTracks = readU16();
        const division = readU16();
        pos = 8 + headerLen;

        const ticksPerQuarter = (division & 0x8000) ? 480 : division;
        const rawEvents = [];

        for (let t = 0; t < numTracks; t++) {
          if (pos + 8 > view.byteLength) break;
          const chunkId = readStr(4);
          const chunkLen = readU32();
          const trackEnd = Math.min(pos + chunkLen, view.byteLength);
          if (chunkId !== "MTrk") {
            pos = trackEnd;
            continue;
          }

          let absTick = 0;
          let runningStatus = 0;

          while (pos < trackEnd) {
            const delta = readVarLen();
            absTick += delta;
            let status = view.getUint8(pos);

            if (status < 0x80) {
              status = runningStatus;
            } else {
              pos++;
              if (status < 0xF0) runningStatus = status;
            }

            if (status === 0xFF) {
              const metaType = view.getUint8(pos++);
              const len = readVarLen();
              if (metaType === 0x51 && len === 3) {
                const mpqn = (view.getUint8(pos) << 16) |
                             (view.getUint8(pos + 1) << 8) |
                             view.getUint8(pos + 2);
                rawEvents.push({ tick: absTick, kind: "tempo", mpqn });
              }
              pos = Math.min(pos + len, trackEnd);
            } else if (status === 0xF0 || status === 0xF7) {
              const len = readVarLen();
              const sysex = [0xF0];
              for (let i = 0; i < len && pos < trackEnd; i++) {
                sysex.push(view.getUint8(pos++));
              }
              if (sysex[sysex.length - 1] !== 0xF7) sysex.push(0xF7);
              rawEvents.push({ tick: absTick, kind: "sysex", bytes: sysex });
            } else {
              const msgType = status & 0xF0;
              const ch = status & 0x0F;
              const d1 = pos < trackEnd ? view.getUint8(pos++) : 0;
              const d2 = (msgType !== 0xC0 && msgType !== 0xD0 && pos < trackEnd)
                ? view.getUint8(pos++)
                : 0;
              rawEvents.push({ tick: absTick, kind: "midi", status, msgType, ch, d1, d2 });
            }
          }
          pos = trackEnd;
        }

        // Convert ticks to seconds using tempo map
        rawEvents.sort((a, b) => a.tick - b.tick);
        let currentMpqn = 500000; // 120 BPM default
        let lastTick = 0;
        let currentSec = 0;
        const timedEvents = [];

        for (const ev of rawEvents) {
          const dtTicks = ev.tick - lastTick;
          currentSec += (dtTicks * currentMpqn) / (ticksPerQuarter * 1000000);
          lastTick = ev.tick;

          if (ev.kind === "tempo") {
            currentMpqn = ev.mpqn;
          } else {
            timedEvents.push({ ...ev, timeSec: currentSec });
          }
        }

        this.events = timedEvents;
        this.durationSec = timedEvents.length ? timedEvents[timedEvents.length - 1].timeSec : 0;
        this.songTimeSec = 0;
        this.nextEventIdx = 0;
      }

      async loadAndPlay(url) {
        this.stop();
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to fetch MIDI: ${res.status}`);
        const buf = await res.arrayBuffer();
        this.parseStandardMidi(buf);
        this.play();
      }

      play() {
        if (!this.events.length) return;
        this.isPlaying = true;
        this.lastPerfMs = performance.now();
        this.tickLoop();
      }

      pause() {
        this.isPlaying = false;
        this.lastPerfMs = null;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        this.sendPanicReset();
      }

      stop() {
        this.pause();
        this.songTimeSec = 0;
        this.nextEventIdx = 0;
        if (this.onProgress) this.onProgress(0, this.durationSec);
      }

      seek(ratio) {
        const clamped = Math.max(0, Math.min(1, ratio));
        this.songTimeSec = clamped * this.durationSec;
        this.sendPanicReset();
        let idx = 0;
        while (idx < this.events.length && this.events[idx].timeSec < this.songTimeSec) {
          idx++;
        }
        this.nextEventIdx = idx;
        if (this.onProgress) this.onProgress(this.songTimeSec, this.durationSec);
      }

      dispatchEvent(ev, schedulePerfMs) {
        if (ev.kind === "sysex") {
          this.sendRaw(ev.bytes, schedulePerfMs);
          return;
        }

        const { status, msgType, ch, d1, d2 } = ev;

        // Note On / Note Off + 88-key visual feedback
        if (msgType === 0x90 && d2 > 0) {
          setKeyActive(d1, true);
          this.sendRaw([status, d1, d2], schedulePerfMs);
        } else if (msgType === 0x80 || (msgType === 0x90 && d2 === 0)) {
          setKeyActive(d1, false);
          this.sendRaw([0x80 | ch, d1, 0], schedulePerfMs);
        } else if (msgType === 0xB0) {
          // Supports continuous pedaling (CC#64 Sustain, CC#66 Sostenuto, CC#67 Soft)
          // and high-resolution velocity (CC#88) alongside standard CCs
          this.sendRaw([status, d1, d2], schedulePerfMs);
        } else {
          this.sendRaw(
            (msgType === 0xC0 || msgType === 0xD0) ? [status, d1] : [status, d1, d2],
            schedulePerfMs
          );
        }
      }

      tickLoop = () => {
        if (!this.isPlaying) return;
        const nowPerf = performance.now();
        if (this.lastPerfMs !== null) {
          const elapsedSec = ((nowPerf - this.lastPerfMs) / 1000) * this.tempoScale;
          this.songTimeSec += elapsedSec;
        }
        this.lastPerfMs = nowPerf;

        const horizonSec = this.songTimeSec + this.lookaheadSec;
        while (
          this.nextEventIdx < this.events.length &&
          this.events[this.nextEventIdx].timeSec <= horizonSec
        ) {
          const ev = this.events[this.nextEventIdx];
          const deltaSec = Math.max(0, (ev.timeSec - this.songTimeSec) / this.tempoScale);
          const targetPerfMs = nowPerf + deltaSec * 1000;
          this.dispatchEvent(ev, targetPerfMs);
          this.nextEventIdx++;
        }

        if (this.onProgress) {
          this.onProgress(this.songTimeSec, this.durationSec);
        }

        if (this.nextEventIdx >= this.events.length && this.songTimeSec >= this.durationSec) {
          this.stop();
          return;
        }

        this.rafId = requestAnimationFrame(this.tickLoop);
      };
    }

    // =========================================================================
    // 3. Catalog Renderer with BWV Badges, Search, Filter & Sorting
    // =========================================================================
    const player = new HiDefMidiPlayer();
    window.midiPlayer = player;
    window.playMidiTrack = async (path) => {
      await player.loadAndPlay(path);
    };

    let catalogTracks = [];
    let activeTrackPath = null;

    function getBwvNumeric(item) {
      const sourceText = `${item.bwv || ""} ${item.title || ""}`;
      const match = sourceText.match(/BWV[\s\-]*(\d+)/i);
      return match ? parseInt(match[1], 10) : Number.MAX_SAFE_INTEGER;
    }

    function getDisplayBwv(item) {
      if (item.bwv && /^BWV\s+/i.test(item.bwv.trim())) {
        return item.bwv.trim().toUpperCase();
      }
      const match = (item.title || "").match(/BWV[\s\-]*(\d+[a-zA-Z0-9]*)/i);
      return match ? `BWV ${match[1].toUpperCase()}` : "";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "00:00";
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, "0")}:${String(rem).padStart(2, "0")}`;
    }

    function renderCatalog() {
      const query = document.getElementById("search-input").value.trim().toLowerCase();
      const category = document.getElementById("category-filter").value;
      const sortBy = document.getElementById("sort-select").value;
      const listEl = document.getElementById("track-list");

      const filtered = catalogTracks
        .map((item, idx) => ({
          ...item,
          _idx: idx,
          _bwvBadge: getDisplayBwv(item),
          _bwvNum: getBwvNumeric(item)
        }))
        .filter((item) => {
          const matchesCat = category === "ALL" || item.category === category;
          if (!matchesCat) return false;
          if (!query) return true;
          const haystack = `${item._bwvBadge} ${item.title} ${item.category} ${item.trackNo || ""}`.toLowerCase();
          return haystack.includes(query);
        })
        .sort((a, b) => {
          if (sortBy === "bwv") {
            if (a._bwvNum !== b._bwvNum) return a._bwvNum - b._bwvNum;
            return a._idx - b._idx;
          }
          if (sortBy === "title") {
            return a.title.localeCompare(b.title);
          }
          return a._idx - b._idx;
        });

      if (!filtered.length) {
        listEl.innerHTML = `<div style="padding:14px; opacity:0.75;">No matching pieces found.</div>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((item) => {
          const isActive = item.path === activeTrackPath ? "active" : "";
          const badgeHtml = item._bwvBadge
            ? `<span class="bwv-badge">${item._bwvBadge}</span>`
            : "";
          return `
            <div class="track-row ${isActive}" data-path="${encodeURI(item.path)}" data-label="${escapeHtml((item._bwvBadge ? item._bwvBadge + " — " : "") + item.title)}">
              <div>
                ${badgeHtml}
                <span>${escapeHtml(item.title)}</span>
              </div>
              <span class="track-meta">${escapeHtml(item.trackNo || "")}</span>
            </div>
          `;
        })
        .join("");

      listEl.querySelectorAll(".track-row").forEach((row) => {
        row.addEventListener("click", async () => {
          const decodedPath = decodeURI(row.dataset.path);
          const label = row.dataset.label;
          activeTrackPath = decodedPath;
          document.getElementById("now-playing").textContent = label;
          renderCatalog();
          await window.playMidiTrack(decodedPath);
        });
      });
    }

    // =========================================================================
    // 4. UI Controls & Initialization
    // =========================================================================
    build88KeyPiano();
    player.initWebMidi();

    player.onProgress = (cur, total) => {
      const pct = total > 0 ? Math.min(100, (cur / total) * 100) : 0;
      document.getElementById("progress-fill").style.width = `${pct}%`;
      document.getElementById("time-readout").textContent = `${formatTime(cur)} / ${formatTime(total)}`;
    };

    document.getElementById("play-pause-btn").addEventListener("click", () => {
      if (player.isPlaying) {
        player.pause();
      } else if (player.events.length) {
        player.play();
      }
    });

    document.getElementById("stop-btn").addEventListener("click", () => {
      player.stop();
    });

    document.getElementById("panic-btn").addEventListener("click", () => {
      player.sendPanicReset();
    });

    document.getElementById("tempo-slider").addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      player.tempoScale = val;
      document.getElementById("tempo-value").textContent = `${Math.round(val * 100)}%`;
    });

    document.getElementById("progress-track").addEventListener("click", (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      player.seek(ratio);
    });

    document.getElementById("search-input").addEventListener("input", renderCatalog);
    document.getElementById("category-filter").addEventListener("change", renderCatalog);
    document.getElementById("sort-select").addEventListener("change", renderCatalog);

    (async function bootstrapCatalog() {
      try {
        const res = await fetch("./catalog-bach.json");
        if (!res.ok) throw new Error("catalog-bach.json not found");
        catalogTracks = await res.json();
        renderCatalog();
      } catch (err) {
        document.getElementById("track-list").innerHTML =
          `<div style="padding:14px; color:#f2b880;">Could not load catalog-bach.json (${escapeHtml(err.message)}).</div>`;
      }
    })();
  </script>
</body>
</html>
