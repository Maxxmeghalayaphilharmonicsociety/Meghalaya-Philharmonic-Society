<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meghalaya Philharmonic Society | Mutopia J.S. Bach MIDI Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
  <style>
    :root {
      --bg: #0d0907;
      --panel: #1b130e;
      --crimson: #4e111b;
      --gold: #e5c158;
      --gold-dim: rgba(229, 193, 88, 0.32);
      --ink: #f3ead8;
      --muted: #c2b49a;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 18px;
      padding: 2rem 1rem 4rem;
    }
    .wrap { max-width: 1060px; margin: 0 auto; }
    h1 {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold);
      margin: 0 0 0.35rem;
      font-size: clamp(1.6rem, 3.5vw, 2.5rem);
    }
    .status { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .box {
      background: var(--panel);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .now { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 0.6rem; }
    midi-player { width: 100%; display: block; margin-bottom: 0.75rem; }
    midi-visualizer {
      width: 100%;
      max-height: 220px;
      overflow-x: auto;
      background: #f5ecd8;
      border-radius: 4px;
    }
    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input, select {
      background: #110c09;
      color: var(--ink);
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-family: inherit;
      font-size: 1rem;
    }
    input { flex: 1; min-width: 220px; }
    .list { display: grid; gap: 0.5rem; max-height: 460px; overflow-y: auto; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.95rem;
      background: #120d0a;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      cursor: pointer;
    }
    .row:hover, .row.active { border-color: var(--gold); background: rgba(78, 17, 27, 0.45); }
    .bwv { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 700; margin-right: 0.5rem; }
    .meta { color: var(--muted); font-size: 0.9rem; font-style: italic; }
    a.dl { color: var(--gold); font-size: 0.85rem; text-decoration: none; border: 1px solid var(--gold-dim); padding: 0.25rem 0.55rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mutopia J.S. Bach MIDI Archive</h1>
    <div id="statusText" class="status">Loading Mutopia Bach catalog...</div>

    <div class="box">
      <div id="nowPlaying" class="now">Select a Bach piece from the list below</div>
      <midi-player
        id="midiPlayer"
        sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus"
        visualizer="#midiViz">
      </midi-player>
      <midi-visualizer id="midiViz" type="staff"></midi-visualizer>
    </div>

    <div class="box">
      <div class="toolbar">
        <input id="searchBox" type="search" placeholder="Search BWV, title, or instrument...">
        <select id="catFilter">
          <option value="ALL">All Categories</option>
        </select>
        <select id="viewSelect">
          <option value="staff" selected>Staff View</option>
          <option value="piano-roll">Piano Roll</option>
          <option value="waterfall">Waterfall</option>
        </select>
      </div>
      <div id="trackList" class="list"></div>
    </div>
  </div>

  <script>
    const MUTOPIA_URL = "https://www.mutopiaproject.org/cgibin/make-table.cgi?Composer=BachJS";
    const midiPlayer = document.getElementById("midiPlayer");
    const midiViz = document.getElementById("midiViz");
    const statusText = document.getElementById("statusText");
    const nowPlaying = document.getElementById("nowPlaying");
    const searchBox = document.getElementById("searchBox");
    const catFilter = document.getElementById("catFilter");
    const viewSelect = document.getElementById("viewSelect");
    const trackList = document.getElementById("trackList");

    let items = [];
    let activeUrl = "";

    viewSelect.addEventListener("change", () => midiViz.setAttribute("type", viewSelect.value));

    function parseMutopiaHtml(htmlText) {
      const doc = new DOMParser().parseFromString(htmlText, "text/html");
      const anchors = [...doc.querySelectorAll("a[href$='.mid'], a[href$='.midi']")];
      const map = new Map();

      for (const a of anchors) {
        const href = a.getAttribute("href");
        if (!href) continue;
        const fullUrl = new URL(href, MUTOPIA_URL).href;
        if (map.has(fullUrl)) continue;

        const blockText = (a.closest("table, tr, li, div, p") || doc.body).textContent.replace(/\s+/g, " ").trim();
        const bwvMatch = blockText.match(/BWV[\s_-]*(?:Anh[\s_-]*)?\d+[a-z]?/i);
        const bwv = bwvMatch ? bwvMatch[0].replace(/[_-]+/g, " ").toUpperCase() : "BWV —";
        const titleMatch = blockText.match(/([^.]{3,110}?)\s+by\s+J\.\s*S\.\s*Bach/i);
        const title = titleMatch ? titleMatch[1].trim() : decodeURIComponent(fullUrl.split("/").pop().replace(/\.midi?$/i, ""));
        const instMatch = blockText.match(/\bfor\s+([^.|\n]{3,65})/i);
        const instrument = instMatch ? instMatch[1].trim() : "Baroque Repertoire";

        let category = "Other Bach Works";
        if (/organ/i.test(instrument)) category = "Organ Works";
        else if (/harpsichord|piano|clavichord/i.test(instrument)) category = "Keyboard";
        else if (/cello|violin|flute|oboe|quartet|trio|sonata/i.test(instrument)) category = "Chamber & Solo";
        else if (/choir|soprano|alto|tenor|bass|voice|cantata|mass/i.test(instrument)) category = "Vocal & Choral";

        map.set(fullUrl, { bwv, title, instrument, category, path: fullUrl });
      }
      return [...map.values()];
    }

    function playPiece(item, autoPlay = true) {
      activeUrl = item.path;
      nowPlaying.textContent = `${item.bwv} — ${item.title} (${item.instrument})`;
      midiPlayer.src = item.path;
      if (autoPlay) {
        midiPlayer.addEventListener("load", () => midiPlayer.start(), { once: true });
      }
      renderList();
    }

    function renderList() {
      const q = searchBox.value.toLowerCase().trim();
      const cat = catFilter.value;
      const filtered = items.filter(x =>
        (cat === "ALL" || x.category === cat) &&
        (!q || `${x.bwv} ${x.title} ${x.instrument} ${x.category}`.toLowerCase().includes(q))
      );

      trackList.innerHTML = filtered.map((x, idx) => `
        <div class="row ${x.path === activeUrl ? "active" : ""}" data-i="${idx}">
          <div>
            <span class="bwv">${x.bwv}</span>
            <span>${x.title}</span>
            <div class="meta">${x.category} • ${x.instrument}</div>
          </div>
          <a class="dl" href="${x.path}" target="_blank" rel="noopener" onclick="event.stopPropagation()">.MID</a>
        </div>
      `).join("");

      trackList.querySelectorAll(".row").forEach((el, idx) => {
        el.addEventListener("click", () => playPiece(filtered[idx], true));
      });
    }

    async function loadCatalog() {
      try {
        const res = await fetch(MUTOPIA_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const html = await res.text();
        items = parseMutopiaHtml(html);
        statusText.textContent = `Loaded ${items.length} J.S. Bach MIDI works live from Mutopia Project.`;
      } catch (err) {
        try {
          const fallback = await fetch("mutopia_bach.json");
          items = await fallback.json();
          statusText.textContent = `Loaded ${items.length} J.S. Bach MIDI works from local mutopia_bach.json (live browser fetch blocked by CORS).`;
        } catch (e2) {
          statusText.textContent = "Could not load live Mutopia HTML (CORS) or mutopia_bach.json. Run the PowerShell scraper to generate mutopia_bach.json.";
        }
      }

      const cats = [...new Set(items.map(x => x.category))].sort();
      cats.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        catFilter.appendChild(opt);
      });

      if (items.length > 0) playPiece(items[0], false);
      renderList();
    }

    searchBox.addEventListener("input", renderList);
    catFilter.addEventListener("change", renderList);
    loadCatalog();
  </script>
</body>
</html>
